name: Build Christian Life Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build signed APK and AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare signing keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/christian-life-release.keystore"
          chmod 600 "$RUNNER_TEMP/christian-life-release.keystore"

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build signed release APK and AAB
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/christian-life-release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew clean assembleRelease bundleRelease

      - name: Show generated files
        run: |
          find app/build/outputs -type f \( -name "*.apk" -o -name "*.aab" \) -print

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Christian-Life-release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: Christian-Life-release-AAB
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

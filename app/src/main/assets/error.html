<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes">
  <title>Error</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      text-align: center;
      margin: 0;
      padding: 32px 20px;
      background: #f5f5f5;
      color: #222;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    h2 { margin: 0 0 12px; font-size: 1.35rem; }
    p { margin: 0 0 24px; color: #555; line-height: 1.5; max-width: 320px; }
    button {
      background: #6200EE;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 14px 32px;
      font-size: 16px;
      cursor: pointer;
    }
    button:active { opacity: 0.85; }
  </style>
</head>
<body>
  <h2>Unable to load page</h2>
  <p>Check your internet connection and try again.</p>
  <button type="button" onclick="retry()">Retry</button>
  <script>
    function retry() {
      if (window.AndroidApp && AndroidApp.retry) {
        AndroidApp.retry();
      } else {
        location.reload();
      }
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Internet required</title>
    <style>
        body{font-family:sans-serif;text-align:center;padding:32px 20px;background:#1a1a2e;color:#fff;margin:0}
        .box{max-width:360px;margin:40px auto;padding:28px;background:#16213e;border-radius:16px}
        h2{color:#e94560;margin:0 0 12px}
        p{line-height:1.6;font-size:16px;color:#eaeaea}
        .icon{font-size:48px;margin-bottom:12px}
    </style>
</head>
<body>
<div class="box">
    <div class="icon">📡</div>
    <h2>Please turn on the internet</h2>
    <p>This app needs an internet connection to load your website.<br><br>
        Turn on mobile data or Wi‑Fi, then pull down to refresh or reopen the app.</p>
</div>
</body>
</html>
